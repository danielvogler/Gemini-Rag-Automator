[project]
name = "gemini-rag-automator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudevents>=1.12.0",
    "functions-framework>=3.10.1",
    "google-adk>=1.31.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.135.0",
    "google-cloud-firestore>=2.20.0",
    "google-cloud-secret-manager>=2.26.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.12",
]

[project.scripts]
gra-ingest = "local_ingestor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor", "src/local_ingestor", "src/agent"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "types-mock>=5.2.0.20260408",
]

[tool.mypy]
files = ["src", "scripts"]
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
pythonpath = ["."]
